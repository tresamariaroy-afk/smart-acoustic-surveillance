{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height:90vh;background:#0f172a;">
  <div class="card shadow p-4" style="width:400px;">
    <h3 class="text-center mb-4">Welcome Back</h3>
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button class="btn btn-primary w-100">Log In</button>
      <a href="{% url 'home' %}" class="btn btn-outline-secondary w-100 mt-2">Back</a>
      <p class="text-center mt-3 mb-0">New user? <a href="{% url 'register' %}">Register</a></p>
    </form>
  </div>
</div>
{% endblock %}
