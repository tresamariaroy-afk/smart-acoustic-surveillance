{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="d-flex justify-content-center align-items-center py-4" style="min-height:90vh;background:#0f172a;">
  <div class="card shadow p-4" style="width:450px;">
    <h3 class="text-center mb-3">Create Account</h3>
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    <form method="post">
      {% csrf_token %}
      <input name="fullname" class="form-control mb-2" placeholder="Full name" required>
      <input name="email" type="email" class="form-control mb-2" placeholder="Email" required>
      <input name="mobile" class="form-control mb-2" placeholder="Mobile" required>
      <input name="address" class="form-control mb-2" placeholder="Address">
      <input name="username" class="form-control mb-2" placeholder="Username" required>
      <input name="password" type="password" class="form-control mb-2" placeholder="Password" required>
      <input name="confirm" type="password" class="form-control mb-3" placeholder="Confirm password" required>
      <button class="btn btn-primary w-100">Register</button>
      <a href="{% url 'login' %}" class="btn btn-outline-secondary w-100 mt-2">Back to Login</a>
    </form>
  </div>
</div>
{% endblock %}
