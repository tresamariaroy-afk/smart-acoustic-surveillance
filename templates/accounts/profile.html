{% extends 'base.html' %}
{% block title %}Profile{% endblock %}
{% block content %}
<h4 class="mb-3">Edit Profile</h4>
<div class="card p-4" style="max-width:600px;">
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="text-center mb-3">
      {% if user.profile_image %}
        <img src="{{ user.profile_image.url }}" class="rounded-circle" width="100" height="100" style="object-fit:cover">
      {% else %}
        <i class="bi bi-person-circle display-3"></i>
      {% endif %}
    </div>
    <input name="fullname" class="form-control mb-2" placeholder="Full name" value="{{ user.get_full_name }}">
    <input name="mobile" class="form-control mb-2" placeholder="Mobile" value="{{ user.mobile }}">
    <input name="email" type="email" class="form-control mb-2" placeholder="Email" value="{{ user.email }}">
    <input name="address" class="form-control mb-2" placeholder="Address" value="{{ user.address }}">
    <label class="form-label mt-2">Profile image</label>
    <input type="file" name="profile_image" class="form-control mb-3" accept="image/*">
    <hr>
    <label class="form-label">Change password (optional)</label>
    <input name="new_password" type="password" class="form-control mb-3" placeholder="New password">
    <button class="btn btn-primary">Save Changes</button>
  </form>
</div>
{% endblock %}
