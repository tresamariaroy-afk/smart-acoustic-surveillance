{% extends 'base.html' %}
{% block title %}System Settings{% endblock %}
{% block content %}
<h4 class="mb-3">Manage System</h4>
<div class="row g-3">
  <div class="col-md-6">
    <div class="card p-3">
      <h6>Add Device / Location</h6>
      <form method="post">{% csrf_token %}
        <input type="hidden" name="action" value="device">
        <input name="device_id" class="form-control mb-2" placeholder="Device ID" required>
        <input name="location" class="form-control mb-2" placeholder="Location name" required>
        <button class="btn btn-primary">Add</button>
      </form>
    </div>
  </div>
  <div class="col-md-6">
    <div class="card p-3">
      <h6>Harmful Word List</h6>
      <form method="post">{% csrf_token %}
        <input type="hidden" name="action" value="word">
        <input name="word" class="form-control mb-2" placeholder="Add harmful word" required>
        <button class="btn btn-primary">Add Word</button>
      </form>
    </div>
  </div>
  <div class="col-md-6">
    <div class="card p-3">
      <h6>Upload Trained Model (.pkl)</h6>
      <form method="post" enctype="multipart/form-data">{% csrf_token %}
        <input type="hidden" name="action" value="model">
        <input type="file" name="model_file" class="form-control mb-2" accept=".pkl,.joblib">
        <button class="btn btn-warning">Upload Model</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
